services:
  api:
    build:
      context: /home/tobi/photoguard/upgraded
      dockerfile: docker/backend.Dockerfile
    image: ${PHOTOGUARD_API_IMAGE:-photoguard-api}
    environment:
      PHOTOGUARD_MODEL_DIR: /app/models/local_inpaint_model
      PHOTOGUARD_LOCAL_FILES_ONLY: "${PHOTOGUARD_LOCAL_FILES_ONLY:-1}"
      PHOTOGUARD_REQUIRE_FULL_STRENGTH: "${PHOTOGUARD_REQUIRE_FULL_STRENGTH:-1}"
      PHOTOGUARD_ENABLE_XFORMERS: "${PHOTOGUARD_ENABLE_XFORMERS:-1}"
      PHOTOGUARD_COMPILE: "${PHOTOGUARD_COMPILE:-0}"
    volumes:
      - ${MODEL_DIR:-/home/tobi/photoguard/upgraded/artifacts/local_inpaint_model}:/app/models/local_inpaint_model:ro
      - immuna_upgraded_cache:/root/.cache
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: /home/tobi/photoguard
      dockerfile: immuna-meeting-docker/web.Dockerfile
    image: ${IMMUNA_WEB_IMAGE:-photoguard-web}
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-http://api:8000}"
      API_UPSTREAM_231: "${API_UPSTREAM_231:-http://api:8000}"
      API_UPSTREAM_232: "${API_UPSTREAM_232:-http://api:8000}"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  immuna_upgraded_cache:
