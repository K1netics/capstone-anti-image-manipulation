services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${API_IMAGE:-photoguard-upgraded-api}
    environment:
      PHOTOGUARD_MODEL_DIR: /app/models/local_inpaint_model
      PHOTOGUARD_LOCAL_FILES_ONLY: "${PHOTOGUARD_LOCAL_FILES_ONLY:-0}"
      PHOTOGUARD_REQUIRE_FULL_STRENGTH: "${PHOTOGUARD_REQUIRE_FULL_STRENGTH:-1}"
      PHOTOGUARD_ENABLE_XFORMERS: "${PHOTOGUARD_ENABLE_XFORMERS:-1}"
      PHOTOGUARD_COMPILE: "${PHOTOGUARD_COMPILE:-0}"
    volumes:
      - ${MODEL_DIR:-./artifacts/local_inpaint_model}:/app/models/local_inpaint_model:ro
      - photoguard_upgraded_cache:/root/.cache
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    image: ${WEB_IMAGE:-photoguard-upgraded-web}
    depends_on:
      - api
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-http://api:8000}"
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  photoguard_upgraded_cache:

